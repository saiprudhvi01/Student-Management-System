{% extends "base.html" %}

{% block content %}

<h1>Dashboard</h1>

<p>Welcome, {{ current_user.name }}</p>

<div class="cards">

    <div class="card">

        <h3>Students</h3>

        <h1>{{ student_count }}</h1>

    </div>

    <div class="card">

        <h3>Teachers</h3>

        <h1>{{ teacher_count }}</h1>

    </div>

    <div class="card">

        <h3>Subjects</h3>

        <h1>{{ subject_count }}</h1>

    </div>

</div>

{% endblock %}
