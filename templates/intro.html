<!DOCTYPE html>
<html>

<head>

    <title>EduTrack - Student Management System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>
        .intro-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            text-align: center;
            padding: 20px;
        }

        .slide.active {
            opacity: 1;
        }

        .slide h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            color: var(--accent);
            margin-bottom: 20px;
            animation: slideUp 0.8s ease-out;
        }

        .slide p {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--muted);
            max-width: 600px;
            line-height: 1.6;
            animation: slideUp 0.8s ease-out 0.2s backwards;
        }

        .slide-icon {
            font-size: clamp(4rem, 10vw, 6rem);
            margin-bottom: 30px;
            animation: scaleIn 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .progress-bar {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 107, 53, 0.3);
            transition: background 0.3s ease;
        }

        .progress-dot.active {
            background: var(--accent);
        }

        .skip-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 107, 53, 0.2);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .skip-btn:hover {
            background: var(--accent);
            color: white;
        }
    </style>

</head>

<body>

<div class="intro-slideshow" id="introSlideshow">

    <div class="slide active" id="slide1">
        <div class="slide-icon">🎓</div>
        <h1>Welcome to EduTrack</h1>
        <p>Your complete Student Management Solution</p>
    </div>

    <div class="slide" id="slide2">
        <div class="slide-icon">📊</div>
        <h1>Track Everything</h1>
        <p>Students, Teachers, Subjects, Attendance & Marks</p>
    </div>

    <div class="slide" id="slide3">
        <div class="slide-icon">🚀</div>
        <h1>Get Started</h1>
        <p>Streamline your academic administration today</p>
    </div>

    <div class="progress-bar">
        <div class="progress-dot active" id="dot1"></div>
        <div class="progress-dot" id="dot2"></div>
        <div class="progress-dot" id="dot3"></div>
    </div>

    <button class="skip-btn" onclick="skipIntro()">Skip</button>

</div>

<script>
    let currentSlide = 1;
    const totalSlides = 3;
    const slideDuration = 3000;

    function showSlide(n) {
        for (let i = 1; i <= totalSlides; i++) {
            document.getElementById('slide' + i).classList.remove('active');
            document.getElementById('dot' + i).classList.remove('active');
        }
        document.getElementById('slide' + n).classList.add('active');
        document.getElementById('dot' + n).classList.add('active');
    }

    function nextSlide() {
        currentSlide++;
        if (currentSlide > totalSlides) {
            window.location.href = "{{ url_for('landing') }}";
        } else {
            showSlide(currentSlide);
            setTimeout(nextSlide, slideDuration);
        }
    }

    function skipIntro() {
        window.location.href = "{{ url_for('landing') }}";
    }

    setTimeout(nextSlide, slideDuration);
</script>

</body>

</html>
