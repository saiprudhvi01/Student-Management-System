<!DOCTYPE html>
<html>

<head>

    <title>EduTrack Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="login-box">

    <h1>EduTrack</h1>

    <p>Student Academic Management System</p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="demo">
        Admin: admin / admin123
        <br>
        Teacher: teacher / teacher123
    </p>

</div>

</body>

</html>
