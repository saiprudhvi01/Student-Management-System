{% extends "base.html" %}

{% block content %}

<h1>Subject Management</h1>

<form method="POST" action="/subjects/add">

    <input
        name="code"
        placeholder="Subject Code"
        required
    >

    <input
        name="name"
        placeholder="Subject Name"
        required
    >

    <input
        name="department"
        placeholder="Department"
    >

    <input
        name="semester"
        type="number"
        placeholder="Semester"
    >

    <button type="submit">
        Add Subject
    </button>

</form>

<hr>

<div class="table-wrap">
    <table>

    <tr>
        <th>ID</th>
        <th>Code</th>
        <th>Subject</th>
        <th>Department</th>
        <th>Semester</th>
    </tr>

    {% for subject in subjects %}

    <tr>

        <td>{{ subject.id }}</td>
        <td>{{ subject.code }}</td>
        <td>{{ subject.name }}</td>
        <td>{{ subject.department }}</td>
        <td>{{ subject.semester }}</td>

    </tr>

    {% endfor %}

    </table>
</div>

{% endblock %}
